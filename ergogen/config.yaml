# Hypothenar - chip-direct PCBA design.
#
# Architecturally different from rc1:
#   - Discrete nRF52840 module (MS88SF3) on the PCB, not a Nice!Nano daughter board.
#   - 2x MCP23017 I/O expanders per half driving the switch matrix via I2C.
#   - Switch-per-pin (each key directly wired to a unique GPIO) - no diodes.
#   - One PCB design per half (no reversibility; v1 emits this config twice
#     with mirroring for the right half).
#
# Status: MS88SF3 PAD MAP VALIDATED (2026-07) against the Minew MS88SF3
# rev-K datasheet (Datasheet_K_EN, section 3 Pin Description diagram) -
# every assigned pad (GND 1/18/34, VDD 31, VDDH 32, VBUS 35, D- 36, D+ 37,
# SWDIO 49, SWCLK 50, and GPIOs P9=P0.02, P10=P0.29, P11=P0.28, P12=P0.30,
# P13=P0.31, P14=P0.27, P15=P0.05, P16=P0.04/AIN2, P17=P0.26, P28=P0.18,
# P41=P0.17, P44=P0.20, P45=P0.22) matches the datasheet pad-for-pad.
# NOTE: pad 33=DCCH (DC/DC out) and 51=RF are correctly left NC (module
# handles DC/DC + antenna internally); pads 24/25=P0.00/P0.01 are the
# LFXO pins - the module has no 32.768kHz crystal, so ZMK runs the
# internal RC (fine for BLE). Component positions in the MCU/power zone
# are still first-pass; expect to iterate placement in KiCad.

units:
  kx: cx
  ky: cy
  px: kx+2
  py: ky+2
  # MCU module: MS88SF3 is 12.5 x 18.5 mm (kleeb footprint extents)
  mcu_width: 13
  mcu_height: 19
  # I/O expander: MCP23017 in SOIC-28W is ~10 x 18 mm including pads
  mcp_width: 10
  mcp_height: 19
  # USB-C: ~9 x 7.5 mm
  usbc_width: 10
  usbc_height: 8
  # Power chips smaller: TP4056 5x4, XC6206 4x2.5, USBLC6 3x2
  # General spacing
  mcu_padding: 1.5
  switchplate_switch_cutout: 14
  scrollwheel_width: 17
  scrollwheel_height: 14
  screw_diameter: 4.7
  screw_hole: 4.1

points:
  rotate: 5
  zones:
    # === Matrix: 5 rows x 6 cols, same physical layout as rc1's `thenar/`.
    # Each key gets a unique `switch_net` (not a matrix col_net/row_net) so
    # we can wire each switch to a dedicated MCP23017 GPIO.
    matrix:
      anchor.shift: [50, -150]
      key:
        tags: [switch]
        padding: 1ky
        spread: 1kx
      columns:
        outer:
          rows:
            mod.skip: true
          key:
            column_net: GND      # one pad of each switch -> GND
        pinky:
          rows:
            mod.skip: true
          key:
            origin: [0, 8]
            column_net: GND
        ring:
          rows:
            mod.skip: true
          key:
            origin: [0, 8]
            stagger: 0.66ky
            splay: -5
            column_net: GND
        middle:
          key:
            stagger: 0.33ky
            column_net: GND
        index:
          key:
            stagger: -0.33ky
            column_net: GND
        inner:
          rows:
            mod.skip: true
          key:
            stagger: -2.5
            column_net: GND
      rows:
        # The `row_net` ergogen assigns to each row would normally be the
        # column-driver wire. In switch-per-pin we override per-key with
        # a unique net via the `from`/`to` params on the choc footprint -
        # see the pcbs.footprints section below.
        mod:    { row_net: __mod__,    tags: [switch_bottom] }
        bottom: { row_net: __bottom__, tags: [switch_top] }
        home:   { row_net: __home__,   tags: [switch_bottom] }
        top:    { row_net: __top__,    tags: [switch_top] }
        num:    { row_net: __num__,    tags: [switch_bottom] }

    # === Thumb cluster
    thumbs:
      anchor:
        ref: matrix_middle_home
        shift: [38, -44]
      key:
        tags: [switch]
        padding: 1ky
        spread: 1kx
      columns:
        layer:
          key:
            splay: -15
            column_net: GND
        space:
          key:
            width: 1.5kx
            splay: 75
            shift: [13-kx, -3]
            column_net: GND
            tags: [switch_space]
      rows:
        cluster:
          row_net: __thumb__

    # === Scrollwheel encoder (EVQWGD001)
    scrollwheel:
      anchor:
        ref: matrix_inner_bottom
      columns:
        scrollwheel:
          key:
            tags: [scrollwheel]
            shift: [kx+mcu_padding-1.25, 0]
            column_net: GND
            width: scrollwheel_width
            height: scrollwheel_height
      rows:
        scrollwheel:
          row_net: __scroll__

    # === MCU module (MS88SF3 nRF52840)
    # BOTTOM side (B.Cu), east of the inner switch column, rotated -8.12
    # degrees so its antenna edge runs parallel to the sloped top-right
    # board edge (the segment from the inner column's top-right corner
    # down to the right edge). NOTE: ergogen +y is UP. The board edge
    # crosses the module at the antenna courtyard line (local y=-4.7),
    # so the antenna section overhangs the edge and the whole antenna
    # keepout courtyard is off-board over air; all module pads stay
    # >=1.3mm inside Edge.Cuts.
    mcu:
      anchor:
        ref: matrix_inner_num
        shift: [22.22, 3.16]
      columns:
        mcu:
          key:
            tags: [mcu]
            width: mcu_width
            height: mcu_height

    # === I/O expanders. Two MCP23017s per half, both on the BOTTOM side.
    # A SOIC-28W (~10 x 19 mm incl. pads) cannot fit inside the key grid
    # itself: the clear band between hotswap-socket rows is ~7.8mm and the
    # column channels are ~3.9mm, both smaller than the 9.9mm pad span.
    # Instead: #1 hides on B.Cu directly under the Nice!View display
    # (which is F-side-only there, hovering 7mm up on its header over
    # the slider/reset stretch of the inner edge), #2 stands in the
    # strip between the inner column sockets and the battery pads.
    io_expander_1:
      anchor:
        ref: matrix_inner_num
        shift: [25.43, -21.21]
      columns:
        ic:
          key:
            # Per-zone tag (not shared) so the pcbs.footprints `where:`
            # filter can target each expander individually.
            tags: [mcp_a]
            width: mcp_width
            height: mcp_height
    io_expander_2:
      anchor:
        ref: io_expander_1_ic
        shift: [-13, 1.5]
      columns:
        ic:
          key:
            tags: [mcp_b]
            width: mcp_width
            height: mcp_height

    # === Power section: USB-C + ESD + charge IC + LDO, all BOTTOM side.
    # USB-C sits on the INNER (right) board edge below the reset button,
    # mouth over the edge so the cable exits sideways toward the other
    # half. The ESD chip sits on the D+/D- path between USB-C and MCU;
    # TP4056 + LDO cluster nearby, between MCP #2 and the scrollwheel,
    # near the battery pads.
    usb_c:
      anchor:
        ref: matrix_inner_num
        shift: [36.93, -29.71]
      columns:
        usb:
          key:
            tags: [usb_c]
            width: usbc_width
            height: usbc_height
    charge_ic:
      anchor:
        ref: io_expander_2_ic
        shift: [0, -15]
      columns:
        ic:
          key:
            tags: [charge_ic]
            width: 7
            height: 4.5
    ldo:
      anchor:
        ref: charge_ic_ic
        shift: [8, 0]
      columns:
        ic:
          key:
            tags: [ldo]
            width: 4.5
            height: 4
    esd:
      anchor:
        ref: usb_c_usb
        shift: [-7.5, -3.5]
      columns:
        ic:
          key:
            tags: [esd]
            width: 3
            height: 2

    # === Slider + reset: on the inner (right) board edge, rotated to
    # run along the edge for case access. The Nice!View glass hovers
    # 7mm above them on the F side; both are B-side parts.
    slider:
      anchor:
        ref: matrix_inner_num
        shift: [35, -8.5]
      columns:
        sw:
          key:
            tags: [slider]
            width: 5.5
            height: 8.5
    reset:
      anchor:
        ref: slider_sw
        shift: [0, -11]
      columns:
        sw:
          key:
            tags: [reset]
            width: 3.5
            height: 7.5

    # === Screw holes (4 corners + thumb area)
    screw_top_left:
      anchor.ref.aggregate.parts: [matrix_outer_num, matrix_outer_top]
      anchor.shift: [-2, 0]
      columns.screw.key.tags: [screw]
    screw_top_right:
      anchor.ref.aggregate.parts: [matrix_index_num, matrix_inner_num]
      columns.screw.key.tags: [screw]
    screw_bottom_left:
      anchor.ref.aggregate.parts: [matrix_pinky_bottom, matrix_outer_bottom]
      columns.screw.key.tags: [screw]
    screw_bottom_right:
      anchor.ref.aggregate.parts: [matrix_index_bottom, matrix_index_mod]
        # shift: [-0.5kx, 0]    # uncomment to nudge
      columns.screw.key.tags: [screw]

outlines:
  board:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        # Around the matrix
        - ref: matrix_outer_home
          shift: [-0.5px, -0.5py]
        - ref: matrix_outer_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_outer_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_pinky_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_ring_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_middle_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_middle_num       # top-right of middle column (organic)
          shift: [0.5px, 0.5py]
        # Organic top-right: the edge steps down the column staggers
        # (middle -> index -> inner top-right corners), then a natural
        # -8.12deg slope runs from the inner column's top-right corner
        # out to the right edge. The MS88SF3 is rotated to match that
        # slope so its antenna courtyard hangs off it, over air.
        - ref: matrix_index_num        # index top-right corner
          shift: [0.5px, 0.5py]
        - ref: matrix_inner_num        # inner top-right corner / slope west end
          shift: [0.5px, 0.5py]
        - ref: matrix_inner_num        # slope east end / top of right edge
          shift: [39.5, 5.29]
        - ref: matrix_inner_num        # right edge, down past slider, reset
          shift: [39.5, -36.71]        # and the side-facing USB-C mouth
        - ref: thumbs_space_cluster
          shift: [0.5px, -0.5py]
        - ref: thumbs_space_cluster
          shift: [-0.5px, -0.5py]
        - ref: matrix_index_mod
          shift: [-0.5px, -0.5py]
        - ref: matrix_pinky_bottom
          shift: [0.5px, -0.5py]
        - ref: matrix_outer_bottom
          shift: [-0.5px, -0.5py]
  _switch_cutout:
    - what: rectangle
      where: [switch, switch_top, switch_bottom, switch_space]
      size: switchplate_switch_cutout
      bound: false
  _screw_holes:
    - what: circle
      where: [screw]
      radius: 2.05
  case:
    - what: outline
      name: board
    - what: outline
      name: _screw_holes
      operation: subtract

pcbs:
  keyboard:
    outlines.main.outline: board
    footprints:
      # === Switches: each gets a unique `from` net (named after the key's
      # position) and `to: GND`. That single unique net per switch is what
      # an MCP23017 GPIO pin will be wired to.
      choc:
        what: choc
        where: [switch, switch_top, switch_bottom, switch_space]
        params:
          keycaps: true
          reverse: true
          hotswap: true
          from: "sw_{{name}}"   # unique per switch via ergogen's {{name}}
          to: GND
        adjust:
          rotate: 180

      # === MCU module - MS88SF3
      # MS88SF3 pad numbering is sequential 1..50 around the perimeter of
      # the module (kleeb footprint). Datasheet maps each pad to a specific
      # nRF52840 GPIO. The assignments below are PLACEHOLDERS - confirm
      # against https://store.minew.com/blogs/quickstart-ms88sf3 datasheet
      # before fabbing.
      mcu:
        what: ms88sf3
        where: mcu
        params:
          side: B         # bottom side; pad x-coords mirror automatically
          # VERIFIED against the Minew MS88SF3 datasheet (rev K, pin
          # description drawing p.6). P<n> = module pad number; the
          # nRF52840 GPIO each pad carries is noted per line. Keep this
          # table in sync with zmk/boards/arm/hypothenar/ (dts+pinctrl).
          #
          # Power. High-voltage mode: LiPo feeds VDDH (pad 32) directly;
          # VDD (pad 31) is the internal regulator OUTPUT (REGOUT0=3.3V,
          # set by the nice_nano_v2 bootloader) - decouple it, do NOT
          # tie it to the LDO 3.3V rail.
          P1: GND
          P18: GND
          P34: GND
          P31: VDD_MCU    # internal reg output - 1uF decouple to GND only
          P32: VBAT       # VDDH, 2.5-5.5V battery input
          # P33 (DCCH) left NC - DC/DC inductors are on-module
          # USB - dedicated pads, not GPIO
          P35: VBUS
          P36: USB_DM     # D-
          P37: USB_DP     # D+
          # SWD programming pads (route to the 5-pad header)
          P49: SWDIO
          P50: SWCLK
          # P51 (RF, external antenna) left NC - using the on-module antenna
          # I2C bus to both MCP23017s
          P17: I2C_SDA    # P0.26
          P14: I2C_SCL    # P0.27
          P13: I2C_RESET  # P0.31
          # Encoder quadrature (any GPIO works; GPIOTE handles IRQs)
          P10: ENC_A      # P0.29
          P11: ENC_B      # P0.28
          # Nice!View SPI
          P44: SPI_SCK    # P0.20
          P41: SPI_MOSI   # P0.17
          P45: NV_CS      # P0.22
          # Battery voltage divider (AIN2 is the ADC input)
          P16: BATT_ADC   # P0.04 / AIN2
          P15: BATT_ADC_EN # P0.05 - divider enable
          # Reset button (nRF nRESET-capable pin, needs GPIO_AS_PINRESET)
          P28: RESET      # P0.18
          # MCP23017 interrupt lines (wake-on-keychange instead of I2C
          # polling - the difference between weeks and months of battery)
          P12: MCP_A_INT  # P0.30
          P9: MCP_B_INT   # P0.02
          # === Free GPIOs -> debug/expansion breakout (the matrix is all
          # on the I2C expanders, so ~34 nRF GPIOs are spare). Each gets a
          # GP_<port>_<pin> net that also lands on the breakout header
          # footprint. GPIO<->pad map verified against MS88SF3 rev-K.
          # Trim in KiCad as board space demands (start Max, shrink).
          P6:  GP_P0_03   # AIN1 - the one free analog-capable pin
          P20: GP_P0_07
          P21: GP_P0_06
          P23: GP_P0_11
          P24: GP_P0_01   # LFXO (no module 32k xtal -> usable GPIO)
          P25: GP_P0_00   # LFXO
          P27: GP_P0_08
          P29: GP_P0_16
          P30: GP_P0_14
          P38: GP_P0_19
          P39: GP_P0_13
          P40: GP_P0_15
          P42: GP_P0_21
          P43: GP_P0_23
          P46: GP_P0_24
          P48: GP_P0_25
          P55: GP_P0_09
          P56: GP_P0_10
          P2:  GP_P1_11
          P3:  GP_P1_12
          P4:  GP_P1_10
          P5:  GP_P1_14
          P7:  GP_P1_13
          P8:  GP_P1_15
          P22: GP_P1_08
          P26: GP_P1_09
          P47: GP_P1_00
          P52: GP_P1_02
          P53: GP_P1_04
          P54: GP_P1_06
          P57: GP_P1_07
          P58: GP_P1_05
          P59: GP_P1_01
          P60: GP_P1_03
          # (pads 33=DCCH, 51=RF, 61-64 center = correctly left NC)
        adjust:
          rotate: -8.122  # antenna edge parallel to the sloped board edge

      # === Debug + expansion breakout: SWD + power + all ~34 free GPIOs.
      # Net-wired via the footprint's defaults (they match the GP_* nets on
      # the MS88SF3 free pads + SWDIO/SWCLK/RESET/VCC/GND/VBAT), so no
      # per-net params needed here. PLACEMENT IS A PLACEHOLDER - this 2x20
      # header is ~50x5mm and almost certainly won't fit as-is; move it
      # (and/or trim pads/rows in ergogen or KiCad) once you see the layout.
      # "Start Max, trim to taste."
      breakout:
        what: breakout
        where: mcu
        adjust:
          shift: [0, 30]   # PLACEHOLDER - relocate to open board area
          rotate: 0
        params:
          side: F

      # === I/O expander #1 - left bank (16 switches)
      mcp1:
        what: mcp23017
        where: mcp_a
        params:
          side: B
          VDD: VCC
          VSS: GND
          SCL: I2C_SCL
          SDA: I2C_SDA
          RESET: I2C_RESET
          INTA: MCP_A_INT   # MIRROR mode ORs both ports onto INTA
          INTB: MCP1_INTB_NC
          A0: GND       # address 0x20
          A1: GND
          A2: GND
          # GPB bank (pins 1-8) - num + top rows
          GPB0: sw_matrix_outer_num
          GPB1: sw_matrix_pinky_num
          GPB2: sw_matrix_ring_num
          GPB3: sw_matrix_middle_num
          GPB4: sw_matrix_index_num
          GPB5: sw_matrix_inner_num
          GPB6: sw_matrix_outer_top
          GPB7: sw_matrix_pinky_top
          # GPA bank (pins 21-28) - rest of top + start of home
          GPA0: sw_matrix_ring_top
          GPA1: sw_matrix_middle_top
          GPA2: sw_matrix_index_top
          GPA3: sw_matrix_inner_top
          GPA4: sw_matrix_outer_home
          GPA5: sw_matrix_pinky_home
          GPA6: sw_matrix_ring_home
          GPA7: sw_matrix_middle_home

      # === I/O expander #2 - right bank (remaining 12 switches + spares)
      mcp2:
        what: mcp23017
        where: mcp_b
        params:
          side: B
          VDD: VCC
          VSS: GND
          SCL: I2C_SCL
          SDA: I2C_SDA
          RESET: I2C_RESET
          INTA: MCP_B_INT
          INTB: MCP2_INTB_NC
          A0: VCC       # address 0x21
          A1: GND
          A2: GND
          # GPB bank - rest of home + bottom row
          GPB0: sw_matrix_index_home
          GPB1: sw_matrix_inner_home
          GPB2: sw_matrix_outer_bottom
          GPB3: sw_matrix_pinky_bottom
          GPB4: sw_matrix_ring_bottom
          GPB5: sw_matrix_middle_bottom
          GPB6: sw_matrix_index_bottom
          GPB7: sw_matrix_inner_bottom
          # GPA bank - mod row + thumbs + scrollwheel switch + spares
          GPA0: sw_matrix_middle_mod
          GPA1: sw_matrix_index_mod
          GPA2: sw_thumbs_layer_cluster
          GPA3: sw_thumbs_space_cluster
          GPA4: ENC_SW       # scrollwheel button via I/O expander
          # GPA5-7 left as spares for future expansion

      # === USB-C receptacle
      # HRO TYPE-C-31-M-12. Pad names match the marbastlib KiCad
      # footprint: A1..A12 + B1..B12 (per the USB-C spec) plus SH for
      # the shield tabs.
      usbc:
        what: usb_c
        where: usb_c
        params:
          side: B
          PA1: GND       # GND
          PA12: GND
          PB1: GND
          PB12: GND
          PA4: VBUS      # VBUS
          PA9: VBUS
          PB4: VBUS
          PB9: VBUS
          PA5: USB_CC1   # CC1 (pull-down via 5.1k for UFP)
          PB5: USB_CC2   # CC2 (pull-down via 5.1k for UFP)
          PA6: USB_DP    # D+
          PA7: USB_DM    # D-
          PB6: USB_DP    # D+ (mirror, internally connected through plug)
          PB7: USB_DM    # D-
          PA8: USB_SBU1  # not used for 2.0 - leave or tie GND
          PB8: USB_SBU2
          PSH: GND       # shield tabs to GND
        adjust:
          rotate: 90     # mouth faces the inner (right) board edge -
                         # cable exits sideways toward the other half

      # === USB ESD - between USB-C and MCU
      esd:
        what: usblc6
        where: esd
        params:
          side: B
          DP: USB_DP
          DM: USB_DM
          GND: GND
          VBUS: VBUS

      # === Charge IC
      charge:
        what: tp4056
        where: charge_ic
        params:
          side: B
          TEMP: GND
          PROG: PROG       # tie to GND through 12k for 100mA charge
          GND: GND
          VBAT: VBAT
          STDBY: CHARGE_STDBY
          CHRG: CHARGE_ACTIVE
          VCC: VBUS
          CE: VBUS

      # === LDO 3.3V
      ldo_3v3:
        what: xc6206
        where: ldo
        params:
          side: B
          VIN: VBAT
          GND: GND
          VOUT: VCC

      # === Decoupling capacitors + resistors (0603, JLCPCB Basic tier).
      # All on the BOTTOM side, following their ICs. Positions are
      # adjust.shift offsets (mm) from the tagged zone's point, in that
      # point's frame. Passives keep >=0.6mm to their IC's pads, clear
      # of every hotswap-socket pad / switch hole, and >=1mm to the
      # board outline. Layout notes:
      #   - R3/R4 (CC pulldowns) stand just behind the USB-C pad row,
      #     between MCP #1 and the connector.
      #   - C1/C2 (VBUS) sit next to the TP4056 (its VCC pin).
      #   - R8/R5/D1 form the row above the TP4056; C3 stands between
      #     TP4056 and LDO; C4/C5 sit below/above the LDO.
      #   - C6 sits below the MS88SF3's bottom-left corner (P31/VDD is
      #     bottom-LEFT after the B-side mirror), left of the battery
      #     pads; R7 sits below the module's bottom-right, right of the
      #     battery pads.
      #   - C7 stands above MCP #1, below the battery pads; R1/R2 (I2C
      #     pullups) stand on MCP #1's left flank, above R6.
      #   - C8/R6 stack right of MCP #2 at its (mirrored) VDD flank.
      c1_vbus_bulk:
        what: passive_0603
        where: charge_ic
        adjust: { shift: [-4.9, -1], rotate: 90 }
        params: { side: B, label: C1, from: VBUS, to: GND }   # 4.7uF bulk
      c2_vbus:
        what: passive_0603
        where: charge_ic
        adjust: { shift: [-4.9, -4.5], rotate: 90 }
        params: { side: B, label: C2, from: VBUS, to: GND }   # 100nF
      c3_vbat_charge:
        what: passive_0603
        where: charge_ic
        adjust: { shift: [4.9, -0.5], rotate: 90 }
        params: { side: B, label: C3, from: VBAT, to: GND }   # 1uF, TP4056 BAT side
      c4_vbat_ldo_in:
        what: passive_0603
        where: ldo
        adjust: { shift: [0, -4.8], rotate: 0 }
        params: { side: B, label: C4, from: VBAT, to: GND }   # 1uF, LDO input
      c5_vcc_ldo_out:
        what: passive_0603
        where: ldo
        adjust: { shift: [0, 3.7], rotate: 0 }
        params: { side: B, label: C5, from: VCC, to: GND }    # 1uF, LDO output
      c6_vdd_mcu:
        what: passive_0603
        where: mcu
        adjust.shift: [-7.35, -9.87]
        params: { side: B, label: C6, from: VDD_MCU, to: GND } # 100nF, next to P31
      c7_vcc_mcp1:
        what: passive_0603
        where: mcp_a
        adjust: { shift: [0.7, 11], rotate: 0 }
        params: { side: B, label: C7, from: VCC, to: GND }    # 100nF
      c8_vcc_mcp2:
        what: passive_0603
        where: mcp_b
        adjust: { shift: [6.3, 1.9], rotate: 90 }
        params: { side: B, label: C8, from: VCC, to: GND }    # 100nF
      r1_i2c_scl_pullup:
        what: passive_0603
        where: mcp_a
        adjust: { shift: [-6.1, 9.5], rotate: 90 }
        params: { side: B, label: R1, from: VCC, to: I2C_SCL }   # 4.7k
      r2_i2c_sda_pullup:
        what: passive_0603
        where: mcp_a
        adjust: { shift: [-6.1, 6.5], rotate: 90 }
        params: { side: B, label: R2, from: VCC, to: I2C_SDA }   # 4.7k
      r3_usb_cc1:
        what: passive_0603
        where: usb_c
        adjust: { shift: [-5.6, 2.5], rotate: 90 }
        params: { side: B, label: R3, from: USB_CC1, to: GND }   # 5.1k UFP pulldown
      r4_usb_cc2:
        what: passive_0603
        where: usb_c
        adjust: { shift: [-5.6, -0.5], rotate: 90 }
        params: { side: B, label: R4, from: USB_CC2, to: GND }   # 5.1k UFP pulldown
      r5_charge_prog:
        what: passive_0603
        where: charge_ic
        adjust.shift: [0.4, 3.7]
        params: { side: B, label: R5, from: PROG, to: GND }      # 12k = ~100mA charge
      r6_i2c_reset_pullup:
        what: passive_0603
        where: mcp_b
        adjust: { shift: [6.9, -3], rotate: 90 }
        params: { side: B, label: R6, from: VCC, to: I2C_RESET } # 100k
      r7_reset_pullup:
        what: passive_0603
        where: mcu
        adjust.shift: [2.15, -11.17]
        params: { side: B, label: R7, from: VCC, to: RESET }     # 100k
      # Charge-indicator LED: VBUS -> R8 (1k) -> D1 anode; cathode into
      # the TP4056's open-drain CHRG pin, which sinks while charging.
      # R8 hides on the bottom with the charge IC; D1 sits on TOP, just
      # above the scrollwheel where the user can actually see it. (The
      # one F-side SMD part - hand-solder it or pay for 2-sided PCBA.)
      r8_charge_led:
        what: passive_0603
        where: mcp_b
        adjust.shift: [-4, -11.3]
        params: { side: B, label: R8, from: VBUS, to: CHG_LED }  # 1k limit
      d1_charge_led:
        what: passive_0603
        where: scrollwheel
        adjust.shift: [0.7, 10.8]
        params: { side: F, label: D1, from: CHG_LED, to: CHARGE_ACTIVE } # 0603 LED

      # Battery-sense divider (was MISSING - BATT_ADC floated, so ZMK read
      # garbage SoC and the interrupt-vs-polling battery validation was
      # impossible). Values match the firmware's voltage-divider node
      # (hypothenar.dts: output-ohms=2.0M, full-ohms=2.82M):
      #   R9 (820k) high side  : VBAT -> BATT_ADC
      #   R10 (2.0M) low side   : BATT_ADC -> BATT_ADC_EN (returns through
      #                           the P0.05 enable GPIO, sunk only during a
      #                           sample - near-zero idle draw)
      # VERIFY PLACEMENT on regen - shifts are near the MCU decoupling, may
      # need nudging to clear other footprints (a re-route is required
      # anyway). Net-correct regardless of the pad map.
      r9_batt_div_hi:
        what: passive_0603
        where: mcu
        adjust.shift: [-5.0, -9.87]
        params: { side: B, label: R9, from: VBAT, to: BATT_ADC }   # 820k
      r10_batt_div_lo:
        what: passive_0603
        where: mcu
        adjust.shift: [-5.0, -8.1]
        params: { side: B, label: R10, from: BATT_ADC, to: BATT_ADC_EN } # 2.0M

      # === Battery terminal - two through-hole solder pads for the LiPo
      # leads, left of the slider (between the two MCPs and the display
      # header). Battery + goes through the slider (VBAT_SW) before
      # reaching TP4056/MCU as VBAT.
      battery:
        what: battery_pads
        where: slider
        adjust.shift: [-15.5, 0]
        params: { BAT_P: VBAT_SW, BAT_N: GND }

      # === Display: Nice!View - vertical strip along the inner (right)
      # board edge, pin row at the bottom end, tucked between the num-row
      # band and the scrollwheel. It stays on the FRONT and sits ~7mm
      # above the PCB on its header, so the glass hovers harmlessly over
      # the slider, reset and USB-C zones (all B side); MCP #1 hides
      # underneath it on the bottom side. Only the header row touches
      # the PCB, just above the scrollwheel.
      niceview:
        what: display_nice_view
        where: mcu
        adjust:
          shift: [8.35, -25.57]
          rotate: 0
        params:
          side: F
          reversible: false
          MOSI: SPI_MOSI
          SCK: SPI_SCK
          VCC: VCC
          GND: GND
          CS: NV_CS

      # === Scrollwheel encoder
      scroll:
        what: scrollwheel_mirrored
        where: scrollwheel
        params:
          from: ENC_SW   # button presses
          to: GND
          A: ENC_A
          B: GND
          C: ENC_B
          D: GND

      # === Slider switch (battery cutoff) - long axis along the right edge
      slider:
        what: slider_reversible
        where: slider
        params:
          from: VBAT_SW   # raw battery to slider
          to: VBAT        # output to TP4056 / MCU when on
        adjust:
          rotate: 90

      # === Reset button - long axis along the right edge
      reset_btn:
        what: reset
        where: reset
        params:
          from: GND
          to: RESET       # tied to MCU RESET pin (placeholder)
        adjust:
          rotate: 90

      # === Screw holes
      screw_holes:
        what: hole
        where: [screw]
        params:
          size: screw_diameter
          drill: screw_hole

      # === Silkscreen
      name_text:
        what: text
        where: matrix_middle_home
        params:
          text: "Hypothenar"
        adjust:
          rotate: 82
          shift: [-9, -11]
